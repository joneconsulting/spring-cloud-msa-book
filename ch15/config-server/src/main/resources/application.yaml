server:
  port: 8888

spring:
  boot:
    admin:
      client:
        url: http://localhost:8088 # Admin Server 주소 (예: 포트 8088)
  #  security:
#    user:
#      name: configuser
#      password: configpass
  application:
    name: config-server
  profiles:
#    active: git
    active: native
  cloud:
    config:
      server:
        git:
          uri: https://github.com/joneconsulting/spring-cloud-msa-book # 설정들이 저장된 Git 리포지토리 경로
          default-label: main                                      # 기본 브랜치(label)명 (예: main/master)
          search-paths: config
        native:
          search-locations: file:///C:/Work/local-git-repo
        encrypt:
          enabled: true

logging:
  level:
    org.springframework.security: DEBUG
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}",
       "level":"%p",
       "thread":"%t",
       "logger":"%c",
       "message":"%m",
       "traceId":"%X{traceId}",
       "spanId":"%X{spanId}"}%n

encrypt:
  key: A1B2C3D4E5F6070890ABCDEF12345678  # 대칭 암호화 키 (예시)

#  key-store:
#    location: file:///C:/Work/keystore/apiEncryptionKey.jks    # 키스토어 파일 경로
##    location: file:///Users/edowon/Desktop/Work/keystore/apiEncryptionKey.jks    # 키스토어 파일 경로
#    password: changeit                                     # 키스토어 비밀번호 (storepass)
#    alias: apiEncryptionKey                                # 키 별칭
#    type: jks                                           # (생략 가능, 기본값 jks. PKCS12 사용 시 pkcs12로 명시)
management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - busrefresh
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: always # 헬스 체크 시 상세 정보까지 노출