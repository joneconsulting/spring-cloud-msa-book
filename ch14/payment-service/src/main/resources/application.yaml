server:
  port: 8084

spring:
  application:
    name: payment-service
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    com.example.paymentservice: DEBUG
  pattern:
    level: "%5p [${spring.application.name},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - healthㅌ
          - beans
          - info
          - busrefresh
          - metrics
          - prometheus
  tracing:
    sampling:
      probability: 1.0      # 1.0이면 100% 샘플링 (개발/테스트 환경에서 유용)
    propagation:
      consume: w3c
      produce: w3c
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans