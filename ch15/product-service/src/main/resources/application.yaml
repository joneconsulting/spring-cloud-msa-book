server:
  port: 8081

spring:
  boot:
    admin:
      client:
        url: http://localhost:8088 # Admin Server 주소 (예: 포트 8088)
  application:
    name: product-service
  config:
    import: optional:configserver:http://127.0.0.1:8888
  profiles:
    active: dev
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console
#  datasource:
#    driver-class-name: org.h2.Driver
#    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
#    username: sa
#    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    generate-ddl: true
    database: h2
    defer-datasource-initialization: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    bus:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

greeting:
  message: This is a product service on DEV env. (Local's application.yaml)

logging:
  level:
    org.springframework.security: DEBUG
  pattern:
    console: >
      {"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}",
       "level":"%p",
       "thread":"%t",
       "logger":"%c",
       "message":"%m",
       "traceId":"%X{traceId}",
       "spanId":"%X{spanId}"}%n

management:
  endpoints:
    web:
      exposure:
        include:
          - refresh
          - health
          - beans
          - info
          - busrefresh
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: always # 헬스 체크 시 상세 정보까지 노출
